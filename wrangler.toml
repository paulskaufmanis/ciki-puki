name = "files"
main = "backend/index.js"
compatibility_date = "2024-11-01"

# Serves the built React app; /api/* goes to the Worker first
[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
# run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "guitar-guard-db"
database_id = "4c7e2007-21fb-4444-92c7-7e8d5511742b"

[vars]
TIMEZONE = "Europe/Riga"

# Parent PIN (protects POST /api/config):  wrangler secret put PARENT_PIN
